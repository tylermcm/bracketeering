[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bracketeering"
version = "0.3.3"
description = "Fast, accurate detection and grouping of camera exposure brackets and focus stacks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
pixels = ["pillow>=10"]
dev = ["pytest>=7", "pillow>=10"]

[project.scripts]
bracketeer = "bracketeering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
